<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>婚礼现场大屏</title>
<script src="qrcode.js"></script>
<script src="qrcode-utf8.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#FBF7F0;color:#3A2A20}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
.serif{font-family:"Songti SC","STSong",Georgia,serif}

.wrap{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* 顶部 */
.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:2.6vh 4vw 2vh;
}
.brand{display:flex;align-items:baseline;gap:1.4vw}
.brand .names{font-size:2.4vw;letter-spacing:.18em;color:#7A1F30}
.brand .amp{font-size:2vw;color:#B08D3F}
.brand .en{font-size:.85vw;letter-spacing:.34em;color:#B9A48E;margin-left:.6vw}
.stat{display:flex;align-items:center;gap:2.4vw;font-size:1vw;color:#9C8674}
.stat b{font-size:1.9vw;color:#7A1F30;font-weight:500;margin-right:.3vw}
.hair{height:1px;background:#EADCCB;margin:0 4vw}

/* 全屏按钮：右下角半透明，全屏后自动隐没；双击页面任意位置也可切换 */
#fsBtn{
  position:fixed;bottom:7.5vh;right:2vw;z-index:50;
  font:inherit;font-size:.95vw;letter-spacing:.14em;
  color:#9C8674;background:rgba(255,255,255,.72);
  border:1px solid #E2D2C3;border-radius:2vw;
  padding:.55vh 1.3vw;cursor:pointer;opacity:.5;
  transition:opacity .4s, background .4s;
}
#fsBtn:hover{opacity:1;background:#fff;color:#7A1F30}
body.fs{cursor:none}
body.fs #fsBtn{opacity:0;pointer-events:auto}
body.fs:hover #fsBtn{opacity:.7}

/* 祝福弹幕：浮在页面内容之上 */
.danmaku{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6}
.danmaku span{
  position:absolute;left:100%;white-space:nowrap;
  font-family:"Songti SC","STSong",Georgia,serif;
  font-size:1.6vw;color:#7A1F30;opacity:.88;
  text-shadow:0 1px 0 rgba(255,255,255,.9);
  will-change:transform;
  animation:dmk linear forwards;
}
.danmaku span b{font-weight:400;color:#B08D3F;margin-right:.6vw}
@keyframes dmk{
  from{transform:translateX(0)}
  to{transform:translateX(calc(-100vw - 100%))}
}

/* 舞台 */
.stage{flex:1;position:relative;overflow:hidden}
.view{
  position:absolute;inset:0;display:none;
  padding:3vh 4vw 4vh;
}
.view.on{display:flex;flex-direction:column}

/* 待机 / 二维码 */
.idle{align-items:center;justify-content:center;text-align:center;gap:2vh}
.idle .lead{font-size:2.6vw;letter-spacing:.3em;color:#7A1F30}
.idle .sub{font-size:1.05vw;letter-spacing:.22em;color:#A8917B;margin-top:-1vh}
.qrbox{
  background:#fff;padding:1.4vw;border-radius:1.2vw;
  box-shadow:0 1vw 3vw rgba(122,31,48,.08);margin:1vh 0;
}
.qrbox svg{display:block;width:17vw;height:17vw}
.idle .count{font-size:1.15vw;color:#9C8674;letter-spacing:.1em}
.idle .count b{font-size:2.2vw;color:#7A1F30;font-weight:500;margin:0 .3vw}

/* 拔河 */
.tug{justify-content:center;gap:3vh}
.tug-head{display:flex;justify-content:space-between;align-items:flex-end}
.side{display:flex;flex-direction:column;gap:.6vh}
.side.b{align-items:flex-end;text-align:right}
.side .nm{font-size:1.5vw;letter-spacing:.16em;color:#9C8674}
.side .sc{font-size:4.6vw;line-height:1;color:#7A1F30;font-weight:400}
.side.b .sc{color:#B08D3F}
.track{
  position:relative;height:7vh;border-radius:4vh;background:#F0E4D5;overflow:hidden;
  border:1px solid #E6D5C2;
}
.track .fill{position:absolute;inset:0;display:flex}
.track .fa{background:#7A1F30;transition:width .18s ease-out}
.track .fb{background:#B08D3F;flex:1;transition:width .18s ease-out}
.knot{
  position:absolute;top:-1vh;bottom:-1vh;width:.35vw;background:#FFFDF8;
  box-shadow:0 0 1.4vw rgba(0,0,0,.28);transition:left .18s ease-out;
}
.knot::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:2.6vh;height:2.6vh;border-radius:50%;background:#FFFDF8;
  box-shadow:0 0 1.4vw rgba(0,0,0,.2);
}
.tug-foot{text-align:center;font-size:1vw;color:#A8917B;letter-spacing:.14em}
.result{
  text-align:center;font-size:3.2vw;letter-spacing:.2em;color:#7A1F30;
}

/* 排行榜 */
.rank{align-items:center;gap:2vh}
.rank-title{font-size:1.9vw;letter-spacing:.28em;color:#7A1F30}
.rank-list{width:62vw;display:flex;flex-direction:column;gap:1.1vh;margin-top:1vh}
.rrow{
  display:flex;align-items:center;gap:1.4vw;background:#fff;border:1px solid #F0E2D1;
  border-radius:1vh;padding:1.1vh 1.8vw;
}
.rrow .no{width:2vw;font-size:1.2vw;color:#C4AC93;text-align:center}
.rrow.top1{background:#FDF0F2;border-color:#EFD2D8}
.rrow.top1 .no{color:#7A1F30}
.rrow .nm{flex:1;font-size:1.35vw;color:#3A2A20}
.rrow .tm{font-size:.9vw;color:#B9A48E;letter-spacing:.08em}
.rrow .co{font-size:1.6vw;color:#7A1F30;font-weight:500}
.rank-empty{font-size:1.1vw;color:#B9A48E;letter-spacing:.16em}

/* 祝福墙 */
.wall{gap:1.6vh}
.wall-title{font-size:1.9vw;letter-spacing:.28em;color:#7A1F30;text-align:center}
.wall-grid{
  flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw;
  align-content:start;overflow:hidden;
}
.card{
  background:#fff;border:1px solid #F0E2D1;border-radius:1vh;padding:1.6vh 1.2vw;
  font-size:1.05vw;line-height:1.65;color:#3A2A20;
  animation:pop .45s ease-out both;
}
.card:nth-child(4n+1){transform:rotate(-.6deg)}
.card:nth-child(4n+3){transform:rotate(.5deg)}
.card .who{font-size:.8vw;color:#B08D3F;letter-spacing:.1em;margin-bottom:.6vh}
@keyframes pop{from{opacity:0;transform:translateY(1.4vh) scale(.97)}to{opacity:1}}
.wall-empty{font-size:1.1vw;color:#B9A48E;letter-spacing:.16em;text-align:center;margin-top:8vh}

/* 中奖 */
.winners{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2vw}
.wchip{
  background:#7A1F30;color:#FDF6EE;border-radius:1vh;padding:1.2vh 2vw;
  font-size:1.5vw;letter-spacing:.08em;animation:pop .5s ease-out both;
}

/* 倒计时（之前没人点击时秒数不动，服务端已修，这里负责显示） */
.cd{
  display:none;align-items:center;gap:.55vw;
  background:#7A1F30;color:#FDF6EE;border-radius:2vw;padding:.5vh 1.1vw;
  font-size:1vw;letter-spacing:.12em;
}
.cd.on{display:inline-flex}
.cd b{font-size:1.55vw;font-weight:500;font-variant-numeric:tabular-nums}
.cd .dot{width:.55vw;height:.55vw;border-radius:50%;background:#FDF6EE;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* 小汽车冲刺 */
.race{gap:1vh}
.race-head{display:flex;justify-content:space-between;align-items:flex-end}
.race-title{font-size:1.9vw;letter-spacing:.28em;color:#7A1F30}
.race-sub{font-size:.95vw;color:#A8917B;letter-spacing:.14em}
.race-bar{height:.7vh;border-radius:.4vh;background:#EFE2D5;overflow:hidden;margin:.8vh 0 .2vh}
.race-bar i{display:block;height:100%;background:linear-gradient(90deg,#C0A062,#7A1F30);transition:width .3s linear}
.road{
  position:relative;flex:1;margin-top:.6vh;border-radius:1.6vh;overflow:hidden;
  background:linear-gradient(180deg,#BEE3F6 0%,#DAEFFA 28%,#DAEFFA 32%,#93CC7C 32%,#7FBC6E 70%,#6FAE60 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
}
.road .asphalt{
  position:absolute;left:0;right:0;top:30%;bottom:9%;z-index:1;
  background:linear-gradient(180deg,#73706B,#5A5752 45%,#4E4B47);
  box-shadow:inset 0 .35vh 0 rgba(255,255,255,.22), inset 0 -.35vh 0 rgba(0,0,0,.18);
}
.road .asphalt::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:.55vh;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,#F7EEDC 0 2.6vw,transparent 2.6vw 5.2vw);
  animation:dash .8s linear infinite;opacity:.85;
}
@keyframes dash{from{background-position:0 0}to{background-position:-5.2vw 0}}
.road .finish{
  position:absolute;top:0;bottom:0;right:5%;width:1.1vw;z-index:2;
  background:repeating-linear-gradient(180deg,#FFFDF8 0 1.6vh,#3A2A20 1.6vh 3.2vh);
  opacity:.9;
}
.road .finish::after{
  content:"终 点";position:absolute;top:-3.2vh;left:50%;transform:translateX(-50%);
  font-size:.9vw;letter-spacing:.22em;color:#7A1F30;white-space:nowrap;
}
.road .cloud{
  position:absolute;width:7vw;height:2.4vh;border-radius:2vh;background:rgba(255,255,255,.85);
  animation:drift linear infinite;
}
.road .cloud::after{
  content:"";position:absolute;left:18%;top:-60%;width:60%;height:150%;border-radius:50%;background:inherit;
}
@keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-12vw)}}

.car{
  position:absolute;width:8.6vw;height:5.4vh;z-index:3;
  transition:left .5s cubic-bezier(.25,.9,.3,1), top .6s ease;
}
.car svg{width:100%;height:100%;display:block;filter:drop-shadow(0 .35vh .5vh rgba(0,0,0,.2))}
.car .wh{transform-box:fill-box;transform-origin:center}
.car.boost .wh{animation:spin .32s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.car.boost svg{animation:jiggle .16s linear infinite}
@keyframes jiggle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.35vh) rotate(-1.2deg)}}
.car.boost::before{
  content:"";position:absolute;right:96%;top:52%;width:3.4vw;height:.32vh;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));border-radius:.2vh;
}
/* 头像从天窗探出来 */
.car .ava{
  position:absolute;left:52%;top:-2.1vh;transform:translateX(-50%);
  width:3.6vh;height:3.6vh;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.6vh;color:#fff;border:.36vh solid #FFFDF8;
  box-shadow:0 .3vh .6vh rgba(0,0,0,.18);
  animation:bob 1.2s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-.55vh)}}
.car .who{
  position:absolute;left:50%;bottom:-2.9vh;transform:translateX(-50%);white-space:nowrap;
  font-size:.92vw;letter-spacing:.06em;color:#3A2A20;background:rgba(255,255,255,.88);
  padding:.25vh .8vw;border-radius:1vh;
}
.car .no{
  position:absolute;right:-.2vw;top:-1.6vh;font-size:.95vw;color:#7A1F30;font-weight:500;
  background:#FFFDF8;border-radius:1vh;padding:0 .5vw;
}
.car.lead .no{background:#7A1F30;color:#FDF6EE}

/* 领奖台 */
.podium{
  position:absolute;inset:0;z-index:8;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;
  background:rgba(251,247,240,.94);
  animation:pop .5s ease-out both;
}
.podium.on{display:flex}
.podium h2{font-size:2.4vw;letter-spacing:.3em;color:#7A1F30;font-weight:400}
.podium .row{display:flex;align-items:flex-end;gap:2.6vw}
.pod{display:flex;flex-direction:column;align-items:center;gap:.8vh}
.pod .medal{font-size:2.2vw}
.pod .nm{font-size:1.45vw;color:#3A2A20;letter-spacing:.1em}
.pod .dist{font-size:.9vw;color:#A8917B}
.pod .bar{width:7.5vw;border-radius:.7vh .7vh 0 0}
.pod.p1 .bar{height:13vh;background:linear-gradient(180deg,#D8B871,#C0A062)}
.pod.p2 .bar{height:10vh;background:linear-gradient(180deg,#DAD3CB,#C4BCB2)}
.pod.p3 .bar{height:7.6vh;background:linear-gradient(180deg,#D9A681,#C08A62)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:9}
.confetti i{position:absolute;top:-5vh;border-radius:.2vh;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(700deg)}}

/* 底部滚动 */
.ticker{
  height:7vh;border-top:1px solid #EADCCB;overflow:hidden;
  display:flex;align-items:center;background:#FDFAF4;
}
.ticker .inner{
  display:flex;gap:4vw;white-space:nowrap;will-change:transform;
  animation:slide 38s linear infinite;padding-left:100vw;
}
.ticker .inner span{font-size:1.15vw;color:#8C7566;letter-spacing:.06em}
.ticker .inner em{font-style:normal;color:#B08D3F;margin-right:.8vw}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* 右下小二维码常驻 */
.mini-qr{
  position:absolute;right:3vw;bottom:9vh;background:#fff;padding:.7vw;
  border-radius:.8vw;box-shadow:0 .4vw 1.4vw rgba(122,31,48,.1);
  display:none;text-align:center;
}
.mini-qr svg{width:7vw;height:7vw;display:block}
.mini-qr .t{font-size:.65vw;color:#B9A48E;letter-spacing:.1em;margin-top:.4vh}
.mini-qr.on{display:block}
</style>
</head>
<body>
<button id="fsBtn" title="全屏 / 退出全屏（按 F 键也可切换）">⛶ 全 屏</button>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <span class="names serif" id="names">新郎 &amp; 新娘</span>
      <span class="en">WEDDING LIVE</span>
    </div>
    <div class="stat">
      <span><b id="guestCount">0</b>位来宾已入场</span>
      <span id="clock"></span>
      <span class="cd" id="cdChip"><i class="dot"></i>还剩<b id="cdNum">0</b>秒</span>
    </div>
  </div>
  <div class="hair"></div>

  <div class="stage">
    <div class="view idle on" id="v-idle">
      <div class="lead serif">扫码加入婚礼互动</div>
      <div class="sub">摇 一 摇 · 抢 红 包 · 送 祝 福</div>
      <div class="qrbox" id="qrBig"></div>
      <div class="count"><b id="countBig">0</b>位来宾已入场</div>
    </div>

    <div class="view tug" id="v-tug">
      <div class="tug-head">
        <div class="side a">
          <div class="nm">新 娘 队</div>
          <div class="sc serif" id="scA">0</div>
        </div>
        <div class="side b">
          <div class="nm">新 郎 队</div>
          <div class="sc serif" id="scB">0</div>
        </div>
      </div>
      <div class="track">
        <div class="fill"><div class="fa" id="fillA" style="width:50%"></div><div class="fb" id="fillB" style="width:50%"></div></div>
        <div class="knot" id="knot" style="left:50%"></div>
      </div>
      <div class="tug-foot" id="tugFoot">两队一起摇，绳结过线就赢</div>
      <div class="result serif" id="tugResult" style="display:none"></div>
    </div>

    <div class="view race" id="v-race">
      <div class="race-head">
        <div class="race-title serif">小 汽 车 冲 刺</div>
        <div class="race-sub" id="raceSub">摇一摇或狂点屏幕，跑得最快的人登顶</div>
      </div>
      <div class="race-bar"><i id="raceBar" style="width:0%"></i></div>
      <div class="road" id="raceRoad">
        <div class="asphalt"></div>
        <div class="cloud" style="top:6%;animation-duration:46s"></div>
        <div class="cloud" style="top:16%;animation-duration:62s;animation-delay:-18s;width:5vw"></div>
        <div class="finish"></div>
        <div class="podium" id="racePodium"></div>
        <div class="confetti" id="raceConfetti"></div>
      </div>
    </div>

    <div class="view rank" id="v-rain">
      <div class="rank-title serif">红 包 排 行</div>
      <div class="rank-list" id="rankList"></div>
    </div>

    <div class="view wall" id="v-wall">
      <div class="wall-title serif">来 自 亲 友 的 祝 福</div>
      <div class="wall-grid" id="wallGrid"></div>
    </div>

    <div class="mini-qr" id="miniQr">
      <div id="qrMini"></div>
      <div class="t">扫码加入</div>
    </div>
  </div>

  <div class="ticker"><div class="inner" id="ticker"></div></div>
</div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var NAME_A = q.get('a') || '';
  var NAME_B = q.get('b') || '';
  if(NAME_A && NAME_B){
    document.getElementById('names').textContent = NAME_A + ' & ' + NAME_B;
  } else if(NAME_A){
    document.getElementById('names').textContent = NAME_A;
  }
  var ENTRY = location.origin + '/';

  var $ = function(id){ return document.getElementById(id); };
  var S = {phase:'idle', tug:{a:0,b:0}, remain:0, duration:60, result:null, wall:[], rank:[], race:[], count:0};
  var lastWallId = '';
  var shownWinners = 0;

  function makeQr(el, size){
    el.innerHTML = '';
    try {
      var qr = qrcode(0, 'M');
      qr.addData(ENTRY);
      qr.make();
      el.innerHTML = qr.createSvgTag({cellSize: 6, margin: 0, scalable: true});
      var svg = el.querySelector('svg');
      if(svg){ svg.removeAttribute('width'); svg.removeAttribute('height'); }
    } catch(e){
      el.textContent = '二维码生成失败，请手动输入：' + ENTRY;
    }
  }

  makeQr($('qrBig'));
  makeQr($('qrMini'));

  function connect(){
    var es = new EventSource('/api/stream?role=screen');
    es.onmessage = function(e){
      try { S = JSON.parse(e.data); render(); } catch(err){}
    };
    es.onerror = function(){ es.close(); setTimeout(connect, 1500); };
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(){
    $('guestCount').textContent = S.count || 0;
    $('countBig').textContent = S.count || 0;

    var live = S.remain > 0;
    var key = S.phase;
    ['idle','tug','rain','race','wall'].forEach(function(k){
      $('v-' + k).classList.toggle('on', k === key);
    });
    $('miniQr').classList.toggle('on', key !== 'idle');

    /* 倒计时：由服务端每秒推送，这里只负责显示 */
    $('cdChip').classList.toggle('on', live);
    if(live) $('cdNum').textContent = S.remain;

    var a = S.tug.a || 0, b = S.tug.b || 0, t = a + b;
    var pa = t > 0 ? (a / t * 100) : 50;
    $('scA').textContent = a;
    $('scB').textContent = b;
    $('fillA').style.width = pa + '%';
    $('fillB').style.width = (100 - pa) + '%';
    $('knot').style.left = pa + '%';

    if(S.result){
      $('tugResult').style.display = 'block';
      $('tugResult').textContent = S.result.winner === 'a' ? '新娘队 获胜' : '新郎队 获胜';
      $('tugFoot').style.display = 'none';
    } else {
      $('tugResult').style.display = 'none';
      $('tugFoot').style.display = 'block';
      $('tugFoot').textContent = live ? '还剩 ' + S.remain + ' 秒，继续摇' : '两队一起摇，绳结过线就赢';
    }

    renderRace();
    renderRaceResult();
    renderRank();
    renderWallList();
    renderWinners();
    renderTicker();
    renderDmk();
  }

  /* ---------- 小汽车冲刺 ---------- */
  var raceEls = {};
  var CAR_COLORS = ['#8E2A3F','#C0A062','#B5654A','#7E8F6A','#8C6A9C','#4F7A8C','#C98A5B','#6B8E8A'];
  function hueOf(name){
    var h = 0;
    for(var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return h;
  }
  function carSvg(team){
    var c = team === 'b' ? '#C0A062' : '#8E2A3F';
    var d = team === 'b' ? '#A2813F' : '#6B1B2C';
    return '<svg viewBox="0 0 120 56" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="60" cy="51" rx="45" ry="4.5" fill="rgba(0,0,0,.14)"/>' +
      '<path d="M9 41c0-1 .6-2 1.6-3.2L19 25c2-3 5-4.6 8.6-4.8l18-1.4h14c5.4 0 10 2.2 13.6 6l11.4 10c3.6 3 5.4 5.2 5.4 8.2 0 3-2 5-5 5H14c-3 0-5-2-5-5z" fill="' + c + '"/>' +
      '<path d="M31 25h24l9 8.6H29z" fill="#FDF6EE" opacity=".82"/>' +
      '<rect x="13" y="36" width="94" height="3.4" rx="1.7" fill="' + d + '" opacity=".45"/>' +
      '<g class="wh"><circle cx="34" cy="43" r="9" fill="#3A2A20"/><circle cx="34" cy="43" r="3.4" fill="#E8DCC8"/></g>' +
      '<g class="wh"><circle cx="86" cy="43" r="9" fill="#3A2A20"/><circle cx="86" cy="43" r="3.4" fill="#E8DCC8"/></g>' +
      '<rect x="103" y="30" width="9" height="5" rx="2.2" fill="#FFF3D0"/>' +
      '</svg>';
  }
  function renderRace(){
    var list = S.race || [];
    var road = $('raceRoad');
    var max = 0;
    list.forEach(function(it){ if(it.dist > max) max = it.dist; });
    var target = Math.max(220, max); // 里程基准：领跑者最多跑到 84% 处
    var n = Math.max(1, Math.min(list.length, 6)); // 最多 6 条车道，太挤会看不清
    var laneH = 74 / n;

    list.forEach(function(it, i){
      var el = raceEls[it.id];
      if(!el){
        el = document.createElement('div');
        el.className = 'car';
        el.innerHTML = carSvg(it.team) +
          '<div class="ava" style="background:hsl(' + hueOf(it.name) + ',42%,52%)"></div>' +
          '<div class="who"></div><div class="no"></div>';
        road.appendChild(el);
        raceEls[it.id] = el;
      }
      var pos = Math.max(1, Math.min(84, it.dist / target * 84));
      var prev = parseFloat(el.dataset.pos || '0');
      el.dataset.pos = pos;
      el.style.left = pos + '%';
      el.style.top = (16 + i * laneH) + '%';
      el.style.zIndex = 10 - i;
      el.classList.toggle('lead', it.rank === 1);
      el.querySelector('.ava').textContent = it.name.charAt(0);
      el.querySelector('.who').textContent = it.name + ' · ' + it.dist;
      el.querySelector('.no').textContent = '#' + it.rank;
      if(pos - prev > 0.35){
        el.classList.add('boost');
        clearTimeout(el._bt);
        el._bt = setTimeout(function(){ el.classList.remove('boost'); }, 650);
      }
    });

    Object.keys(raceEls).forEach(function(id){
      var keep = false;
      for(var i = 0; i < list.length; i++){ if(list[i].id === id){ keep = true; break; } }
      if(!keep){ raceEls[id].remove(); delete raceEls[id]; }
    });

    var d = S.duration || 60;
    $('raceBar').style.width = (d > 0 ? Math.max(0, Math.min(100, S.remain / d * 100)) : 0) + '%';
  }

  function podiumHtml(top){
    var order = [1, 0, 2];
    var medals = ['🥇','🥈','🥉'];
    var cls = ['p1','p2','p3'];
    var html = '<h2 class="serif">本 轮 前 三 名</h2><div class="row">';
    order.forEach(function(idx, k){
      var it = top[idx];
      if(!it) return;
      html += '<div class="pod ' + cls[idx] + '">' +
        '<div class="medal">' + medals[idx] + '</div>' +
        '<div class="nm serif">' + esc(it.name) + '</div>' +
        '<div class="dist">' + it.dist + ' 米</div>' +
        '<div class="bar"></div></div>';
    });
    return html + '</div>';
  }

  function confetti(){
    var box = $('raceConfetti');
    box.innerHTML = '';
    var colors = ['#8E2A3F','#C0A062','#7CB96E','#6FA8C9','#E0A0A8','#F0D9A8'];
    for(var i = 0; i < 70; i++){
      var s = document.createElement('i');
      var w = 0.4 + Math.random() * 0.6;
      s.style.left = (Math.random() * 100) + '%';
      s.style.width = w + 'vw';
      s.style.height = (w * 1.8) + 'vh';
      s.style.background = colors[i % colors.length];
      s.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
      s.style.animationDelay = (Math.random() * 1.2) + 's';
      s.style.opacity = 0.9;
      box.appendChild(s);
    }
    setTimeout(function(){ box.innerHTML = ''; }, 6000);
  }

  function renderRaceResult(){
    var pod = $('racePodium');
    var r = S.result;
    if(!r || r.kind !== 'race'){
      if(pod.dataset.sig){ pod.dataset.sig = ''; pod.classList.remove('on'); pod.innerHTML = ''; }
      return;
    }
    if(!r.top || !r.top.length){
      if(pod.dataset.sig !== 'empty'){
        pod.dataset.sig = 'empty';
        pod.innerHTML = '<h2 class="serif">本 轮 结 束</h2><div class="row">' +
          '<div class="pod p1"><div class="medal">🚗</div><div class="nm">没人出发</div>' +
          '<div class="dist">下一局让全场一起冲</div><div class="bar"></div></div></div>';
        pod.classList.add('on');
      }
      return;
    }
    var sig = r.top.map(function(t){ return t.id + ':' + t.dist; }).join(',');
    if(pod.dataset.sig !== sig){
      pod.dataset.sig = sig;
      pod.innerHTML = podiumHtml(r.top);
      pod.classList.add('on');
      confetti();
    }
  }

  /* ---------- 祝福弹幕 ---------- */
  var dmkLayer = null, lastDmkId = '';
  function ensureDmk(){
    if(dmkLayer) return;
    dmkLayer = document.createElement('div');
    dmkLayer.className = 'danmaku';
    document.querySelector('.stage').appendChild(dmkLayer);
  }
  function spawnDmk(m, delay){
    var s = document.createElement('span');
    s.innerHTML = '<b>' + esc(m.name) + '</b>' + esc(m.text);
    s.style.top = (10 + Math.random() * 66) + '%';
    s.style.fontSize = (1.3 + Math.random() * 0.8) + 'vw';
    s.style.animationDuration = (9 + Math.random() * 5) + 's';
    if(delay) s.style.animationDelay = delay + 's';
    s.addEventListener('animationend', function(){ s.remove(); });
    dmkLayer.appendChild(s);
    /* 上限保护：同屏最多 24 条，超出直接丢弃最旧的 */
    while(dmkLayer.children.length > 24) dmkLayer.firstChild.remove();
  }
  function renderDmk(){
    ensureDmk();
    var arr = S.wall || [];
    if(!arr.length) return;
    var newest = arr[arr.length - 1];
    if(!lastDmkId){
      lastDmkId = newest.id;
      /* 首帧把最近的祝福铺出去，错开时间 */
      arr.slice(-8).forEach(function(m, i){ spawnDmk(m, i * 2.2); });
      return;
    }
    var pos = -1;
    for(var i = arr.length - 1; i >= 0; i--){
      if(arr[i].id === lastDmkId){ pos = i; break; }
    }
    if(pos < 0){
      /* 列表被清空过或太长截断：只放最新一条 */
      lastDmkId = newest.id;
      spawnDmk(newest, 0);
      return;
    }
    for(var j = pos + 1; j < arr.length; j++){
      spawnDmk(arr[j], 0);
    }
    lastDmkId = newest.id;
  }

  function renderRank(){
    var list = $('rankList');
    var r = S.rank || [];
    if(!r.length){
      list.innerHTML = '<div class="rank-empty">还没有人得分，等主持人开始抢红包</div>';
      return;
    }
    var html = '';
    for(var i=0;i<r.length;i++){
      var it = r[i];
      html += '<div class="rrow' + (i === 0 ? ' top1' : '') + '">' +
        '<div class="no serif">' + it.rank + '</div>' +
        '<div class="nm">' + esc(it.name) + '</div>' +
        '<div class="tm">' + (it.team === 'a' ? '新娘队' : '新郎队') + '</div>' +
        '<div class="co serif">' + it.coins + '</div></div>';
    }
    list.innerHTML = html;
  }

  function renderWallList(){
    var grid = $('wallGrid');
    var w = (S.wall || []).slice(-16);
    if(!w.length){
      grid.innerHTML = '<div class="wall-empty">等第一条祝福</div>';
      return;
    }
    var html = '';
    for(var i = w.length - 1; i >= 0; i--){
      var m = w[i];
      html += '<div class="card"><div class="who">' + esc(m.name) + '</div>' + esc(m.text) + '</div>';
    }
    grid.innerHTML = html;
  }

  function renderWinners(){
    var wins = S.winners || [];
    if(wins.length === shownWinners) return;
    shownWinners = wins.length;
    if(!wins.length) return;
    var v = $('v-rain');
    var box = $('winnersBox');
    if(!box){
      box = document.createElement('div');
      box.id = 'winnersBox';
      box.className = 'winners';
      box.style.marginTop = '3vh';
      $('rankList').after(box);
    }
    box.innerHTML = wins.map(function(w){
      return '<div class="wchip serif">' + esc(w.name) + '</div>';
    }).join('');
  }

  function renderTicker(){
    var w = (S.wall || []).slice(-18);
    var inner = $('ticker');
    if(!w.length){ inner.innerHTML = '<span>扫码加入，把你的祝福送上大屏</span>'; return; }
    inner.innerHTML = w.map(function(m){
      return '<span><em>' + esc(m.name) + '</em>' + esc(m.text) + '</span>';
    }).join('');
  }

  function tick(){
    var d = new Date();
    var p = function(n){ return n < 10 ? '0' + n : n; };
    $('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes());
  }
  tick();
  setInterval(tick, 15000);

  connect();

  /* —— 全屏控制 —— */
  var fsBtn = document.getElementById('fsBtn');
  function isFs(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function goFs(){
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if(!fn) return;
    try {
      var p = fn.call(el);
      if(p && p.then){
        p.then(function(){
          /* 安卓平板/手机投屏时锁定横屏；电脑浏览器会静默失败，无影响 */
          try {
            if(screen.orientation && screen.orientation.lock){
              screen.orientation.lock('landscape').catch(function(){});
            }
          } catch(e){}
        }).catch(function(){});
      }
    } catch(e){}
  }
  function exitFs(){
    var fn = document.exitFullscreen || document.webkitExitFullscreen;
    if(fn) fn.call(document);
  }
  function toggleFs(){ isFs() ? exitFs() : goFs(); }
  function updFs(){
    document.body.classList.toggle('fs', isFs());
    fsBtn.textContent = isFs() ? '⛶ 退出全屏' : '⛶ 全 屏';
  }
  fsBtn.addEventListener('click', function(e){
    e.stopPropagation();
    toggleFs();
  });
  document.addEventListener('dblclick', function(e){
    if(e.target === fsBtn) return;
    toggleFs();
  });
  /* 双击会先触发两次 click，若首次 click 进了全屏、双击又切出去会来回抖动；
     这里不用单击自动全屏，只靠双击和按钮 */
  document.addEventListener('fullscreenchange', updFs);
  document.addEventListener('webkitfullscreenchange', updFs);
  /* Esc 退出全屏后同步按钮状态 */
  document.addEventListener('keydown', function(e){
    if(e.key === 'f' || e.key === 'F'){ toggleFs(); }
  });
})();
</script>
</body>
</html>
